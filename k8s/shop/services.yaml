# Dummy shop services for the tracing demo. demo-api's /checkout calls inventory ->
# pricing -> payment (-> fraud-check) -> shipping, one after another. Same image as the
# API, started as dummy:app; behaviour comes from the env vars (see app/dummy.py).
# Edit WORK_MS / ERROR_RATE to change the story.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory, tier: shop}
    spec:
      containers:
        - name: inventory
          image: ghcr.io/david-maat/system-design-demo/api:latest
          imagePullPolicy: Always
          command: [uvicorn, "dummy:app", --host, 0.0.0.0, --port, "8000", --no-access-log]
          env:
            - {name: OTEL_SERVICE_NAME, value: inventory}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.monitoring:4318"}
            - {name: WORK_MS, value: "40"}
            - {name: DOWNSTREAM, value: ""}
            - {name: ERROR_RATE, value: "0"}
          ports: [{name: http, containerPort: 8000}]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector: {app: inventory}
  ports: [{name: http, port: 80, targetPort: http}]
