apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-dashboard
  labels: {grafana_dashboard: "1"}
data:
  demo.json: |
    {
      "uid": "viral-demo",
      "title": "Your app just went viral",
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "API pods",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_ready{namespace=\"demo\",pod=~\"demo-api-.*\",condition=\"true\"} == 1)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "DB read replicas",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_ready{namespace=\"demo\",pod=~\"postgres-replica-.*\",condition=\"true\"} == 1) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "k6 req/s",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(k6_http_reqs_total[30s]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "k6 failed %",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "avg(k6_http_req_failed_rate) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency seen by users (k6)",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max(k6_http_req_duration_p95) * 1000",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "max(k6_http_req_duration_p50) * 1000",
              "legendFormat": "p50",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests/s: offered vs. successful",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(k6_http_reqs_total[30s]))",
              "legendFormat": "offered (k6)",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{namespace=\"demo\",status=\"2xx\"}[30s]))",
              "legendFormat": "served 2xx (API)",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU per API pod (limit = 0.2)",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"demo\",pod=~\"demo-api-.*\",container=\"api\"}[30s]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests/s per API pod (load balancing)",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(http_requests_total{namespace=\"demo\"}[30s]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU per Postgres pod (limit = 0.5)",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"demo\",pod=~\"postgres-.*\",container=\"postgres\"}[30s]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API latency by handler (server side p95)",
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[30s]))) * 1000",
              "legendFormat": "{{handler}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
