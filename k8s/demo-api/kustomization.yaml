namespace: demo
resources: [deployment.yaml, service.yaml, ingress.yaml, servicemonitor.yaml]

# ---- DEMO KNOBS ----------------------------------------------------------
# Step 2 (read replica): set READ_DATABASE_URL to the replica URL below.
# configMapGenerator adds a hash suffix, so a change here rolls the pods.
configMapGenerator:
  - name: demo-api
    literals:
      - DATABASE_URL=postgresql://demo:demo-password@postgres-primary:5432/demo
      - READ_DATABASE_URL=
      # - READ_DATABASE_URL=postgresql://demo:demo-password@postgres-replica:5432/demo
      - DB_POOL_SIZE=5
      - DB_CONN_MAX_LIFETIME=15   # seconds; lets connections spread over new replicas
      - HASH_ROUNDS=20000
