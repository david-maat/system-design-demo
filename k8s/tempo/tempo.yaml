# Traces: Tempo single binary (the upstream single-binary Helm chart is deprecated).
# Storage is an emptyDir: traces are demo-only and vanish when the pod restarts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
      log_level: warn
    distributor:
      receivers:
        otlp:
          protocols:
            http: {endpoint: "0.0.0.0:4318"}
            grpc: {endpoint: "0.0.0.0:4317"}
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 24h
    # Turns spans into metrics in Prometheus: request rates/latencies per span and
    # a service graph. DB client spans become nodes named after the host they hit,
    # so the graph shows demo-api -> postgres-primary / postgres-replica.
    metrics_generator:
      registry:
        external_labels: {source: tempo}
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://monitoring-kube-prometheus-prometheus:9090/api/v1/write
            send_exemplars: true
      traces_storage:
        path: /var/tempo/generator/traces
      processor:
        service_graphs:
          peer_attributes: [server.address, net.peer.name, peer.service, db.name]
          # DB nodes are named after the host, not the database name ("demo"),
          # so primary and replica show up as separate nodes.
          database_name_attributes: [server.address, net.peer.name, db.name]
    storage:
      trace:
        backend: local
        wal: {path: /var/tempo/wal}
        local: {path: /var/tempo/blocks}
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: tempo}
  template:
    metadata:
      labels: {app: tempo}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.10.10
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-http, containerPort: 4318}
            - {name: otlp-grpc, containerPort: 4317}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector: {app: tempo}
  ports:
    - {name: http, port: 3200}
    - {name: otlp-http, port: 4318}
    - {name: otlp-grpc, port: 4317}
